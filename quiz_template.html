<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>{quiz_name}</title>
<style>
:root {
  --accent: #2ec4b6;
  --accent-dark: #1da89a;
  --muted: #69707a;
  --success: #1f9e5a;
  --danger: #c82d3f;
  --warning: #f39c12;
  --info: #3498db;
  --purple: #9b59b6;
  --bg: #f5f7fa;
  --card: #fff;
  --text: #111;
  --border: #e6eaec;
  --maxw: 820px;
}
body.dark-mode {
  --accent: #3dd5c4; --accent-dark: #2ec4b6; --muted: #a0a8b4;
  --success: #2ecc71; --danger: #e74c3c; --warning: #f1c40f;
  --info: #5dade2; --purple: #bb8fce; --bg: #1a1e2a;
  --card: #2d3344; --text: #ecf0f1; --border: #3f4758;
}
* { box-sizing: border-box; }
body { margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:96px; transition:background 0.2s,color 0.2s; user-select:none; }
input,textarea { user-select:text !important; }
.container { max-width:var(--maxw); margin:auto; padding:10px 16px; }
header { background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,0.08); position:relative; z-index:10; }
.header-inner { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; gap:12px; flex-wrap:wrap; }
h1 { margin:0; color:var(--accent); font-size:17px; }
.btn { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:10px 14px; min-height:44px; font-size:14px; font-weight:600; cursor:pointer; transition:background 0.18s; }
.btn:hover { background:var(--accent-dark); }
.btn-ghost { background:transparent; color:var(--accent); border:2px solid var(--accent); padding:8px 12px; border-radius:999px; font-weight:700; cursor:pointer; }
.timer-text { color:var(--accent-dark); font-weight:700; font-size:18px; min-width:72px; text-align:right; }
.theme-toggle { position:relative; width:90px; height:34px; background:#eaeef0; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:0 6px; font-size:13px; color:#444; font-weight:600; }
.theme-toggle span { z-index:2; flex:1; text-align:center; }
.theme-toggle::before { content:""; position:absolute; top:3px; left:3px; width:42px; height:28px; background:var(--accent); border-radius:999px; transition:0.28s; }
.theme-toggle.dark::before { transform:translateX(45px); background:var(--accent-dark); }
.theme-toggle.dark span:last-child { color:#fff; }
.theme-toggle span:first-child { color:#fff; }
.card { background:var(--card); border-radius:10px; padding:10px 12px; margin:12px 0; box-shadow:0 4px 10px rgba(0,0,0,0.05); }
.qbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.qmeta { font-size:13px; color:var(--muted); }
.marking { font-size:13px; color:var(--muted); }
.qtext { font-size:16px; margin:6px 0; font-weight:500; line-height:1.5; }
.opt { padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--card); cursor:pointer; display:flex; align-items:center; gap:10px; transition:all 0.12s; font-weight:500; min-height:52px; margin:6px 0; }
.opt:hover { border-color:var(--accent); }
.opt.selected { border-color:var(--accent); background:rgba(46,196,182,0.08); }
.custom-radio { flex-shrink:0; height:16px; width:16px; border-radius:50%; border:2px solid #ccc; }
.opt.selected .custom-radio { border:6px solid var(--accent); }
.fbar { position:fixed; left:0; right:0; bottom:0; background:var(--card); box-shadow:0 -3px 12px rgba(0,0,0,0.08); display:flex; justify-content:center; z-index:50; }
.fbar-inner { display:flex; justify-content:center; align-items:center; gap:8px; max-width:var(--maxw); width:100%; padding:10px; }
.fbar button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:10px 8px; min-height:44px; min-width:60px; font-size:13px; font-weight:600; cursor:pointer; flex:1 1 auto; }
.fbar button:hover { background:var(--accent-dark); }
.btn-clear { background:var(--warning) !important; }
#palette { position:fixed; top:64px; right:14px; background:var(--card); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.12); padding:12px; display:none; gap:8px; flex-wrap:wrap; z-index:200; max-width:300px; max-height:70vh; overflow-y:auto; }
#palette .qbtn { width:44px; height:44px; border-radius:8px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-weight:700; color:var(--text); }
#palette .qbtn.attempted { background:var(--success); color:#fff; border:none; }
#palette .qbtn.unattempted { background:var(--danger); color:#fff; border:none; }
#palette .qbtn.current { border:3px solid var(--accent); font-weight:bold; transform:scale(1.05); }
#palette-summary { margin-top:8px; font-size:13px; color:var(--muted); text-align:center; width:100%; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:300; }
.modal-content { background:var(--card); border-radius:12px; padding:18px; max-width:420px; width:92%; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.18); }
.modal h3 { margin:0 0 8px; color:var(--accent); }
.modal p { color:var(--text); margin:8px 0 12px; font-size:15px; }
.modal .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff; border:none; padding:10px 18px; border-radius:999px; font-weight:700; cursor:pointer; }
.tabs { display:flex; gap:4px; background:var(--card); padding:8px; border-radius:40px; margin:20px 0; }
.tab { flex:1; text-align:center; padding:10px; border-radius:30px; background:transparent; border:none; color:var(--text); font-weight:600; cursor:pointer; min-height:44px; }
.tab.active { background:var(--accent); color:white; }
.section { display:none; }
.section.active { display:block; }
.watermark-container { position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
.watermark { position:absolute; font-size:26px; font-weight:700; color:rgba(0,0,0,0.045); transform:rotate(-30deg); white-space:nowrap; }
body.dark-mode .watermark { color:rgba(255,255,255,0.045); }
mjx-container { max-width:100%; overflow-x:auto; }
@media(max-width:768px){
  .header-inner{flex-direction:column;gap:8px;padding:8px;}
  .fbar-inner{flex-wrap:wrap;padding:8px;gap:6px;}
  .fbar button{padding:8px 6px;font-size:12px;min-width:50px;}
  #palette{top:120px;left:50%;transform:translateX(-50%);max-width:90%;}
}
@media(max-width:480px){
  .timer-text{font-size:16px;}
  h1{font-size:14px;}
  .btn,.btn-ghost{padding:8px 10px;font-size:12px;}
  .fbar button{padding:8px 4px;font-size:11px;min-width:44px;}
  .card{padding:8px;}
}
</style>

</script>

<script>

// ============================================================
//  CONFIGURATION — replace these three values
// ============================================================
const QUIZ_TITLE = "{quiz_name}";          // e.g. "Polity - Chapter 5"
const TOTAL_TIME_SECONDS = {seconds};      // e.g. 600 for 10 minutes

// ============================================================
//  QUESTIONS ARRAY
//  Each object must have:
//    id            : unique number
//    question      : HTML string (bilingual supported)
//    option_1..4   : option text (option_5 optional)
//    answer        : "1" | "2" | "3" | "4" | "5"  (correct option number as string)
//    correct_score : marks for correct answer  (e.g. 1)
//    negative_score: marks deducted for wrong  (e.g. 0 or 0.25)
//    solution_text : explanation HTML shown after submit (optional)
// ============================================================
const QUESTIONS = {questions_array};
/*
EXAMPLE:
const QUESTIONS = [
  {
    id: 1,
    question: "Which Article deals with National Emergency?<br><small style='color:var(--muted)'>राष्ट्रीय आपातकाल किस अनुच्छेद से संबंधित है?</small>",
    option_1: "Article 352 / अनुच्छेद 352",
    option_2: "Article 356 / अनुच्छेद 356",
    option_3: "Article 360 / अनुच्छेद 360",
    option_4: "Article 365 / अनुच्छेद 365",
    answer: "1",
    correct_score: 1,
    negative_score: 0,
    solution_text: "Article 352 deals with the proclamation of <strong>National Emergency</strong>."
  }
];
*/

// ============================================================
//  INTERNAL STATE — do not edit below this line
// ============================================================
let current = 0, answers = {}, seconds = TOTAL_TIME_SECONDS, timerInterval = null;
const QUIZ_STATE_KEY  = "quiz_state_"  + QUIZ_TITLE;
const QUIZ_RESULT_KEY = "quiz_result_" + QUIZ_TITLE;
const el = id => document.getElementById(id);

// ---------- THEME ----------
function initTheme() {
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    el('themeToggle').classList.add('dark');
  }
}
function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  el('themeToggle').classList.toggle('dark', isDark);
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

// ---------- BOOT ----------
window.addEventListener('DOMContentLoaded', () => {
  initTheme();
  el('quizHeader').style.display = 'flex';
  el('quizContainer').style.display = 'block';
  el('floatBar').style.display = 'flex';
  initQuiz();
});

// ---------- INIT ----------
function initQuiz() {
  el("qtotal").textContent = QUESTIONS.length;

  // Restore saved result
  const savedResult = localStorage.getItem(QUIZ_RESULT_KEY);
  if (savedResult) {
    try {
      const payload = JSON.parse(savedResult);
      if (payload && payload.score !== undefined) {
        clearInterval(timerInterval);
        el("quizCard").style.display = "none";
        el("floatBar").style.display = "none";
        displayResults(payload);
        return;
      }
    } catch(e) { localStorage.removeItem(QUIZ_RESULT_KEY); }
  }

  // Restore saved quiz state
  const saved = localStorage.getItem(QUIZ_STATE_KEY);
  if (saved) {
    const s = JSON.parse(saved);
    current = s.current ?? 0;
    answers  = s.answers  ?? {};
    seconds  = s.seconds  ?? seconds;
  }

  renderQuestion(current);
  startTimer();
  attachListeners();
  buildPalette();
}

// ---------- RENDER QUESTION ----------
function renderQuestion(i) {
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i + 1;
  el("qtext").innerHTML = q.question;
  el("marking").innerHTML =
    `Marking: <span style="color:var(--success)">+${q.correct_score}</span> / <span style="color:var(--danger)">-${q.negative_score}</span>`;

  const opts = el("options");
  opts.innerHTML = "";
  const userAns = answers[q.id];

  ["option_1","option_2","option_3","option_4","option_5"].forEach((k, idx) => {
    if (!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt" + (userAns === String(idx+1) ? " selected" : "");
    div.innerHTML = `<div class="custom-radio"></div><div style="flex:1">${q[k]}</div>`;
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
  });

  el("explanation").style.display = "none";

  // Last question: show Submit Test, hide Next
  const isLast = i === QUESTIONS.length - 1;
  el("nextBtn").style.display   = isLast ? "none" : "";
  el("submitBtn").style.display = isLast ? ""     : "none";

  highlightPalette();
  saveQuizState();

  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

// ---------- SELECT OPTION ----------
function selectOption(q, val, div) {
  answers[q.id] = String(val);
  Array.from(el("options").children).forEach(o => o.classList.remove("selected"));
  div.classList.add("selected");
  highlightPalette();
  saveQuizState();
}

// ---------- TIMER ----------
function startTimer() {
  el("timer").textContent = fmt(seconds);
  timerInterval = setInterval(() => {
    seconds--;
    el("timer").textContent = fmt(seconds);
    if (seconds <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

function fmt(s) {
  return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}

// ---------- SAVE STATE ----------
function saveQuizState() {
  localStorage.setItem(QUIZ_STATE_KEY, JSON.stringify({ current, answers, seconds }));
}

// ---------- SUBMIT ----------
function submitQuiz() {
  clearInterval(timerInterval);
  const timeTaken = TOTAL_TIME_SECONDS - seconds;
  let correct = 0, wrong = 0, totalMarks = 0, maxMarks = 0;

  QUESTIONS.forEach(q => {
    maxMarks += Number(q.correct_score);
    const ans = answers[q.id];
    if (ans && ans === String(q.answer)) {
      correct++;
      totalMarks += Number(q.correct_score);
    } else if (ans) {
      wrong++;
      totalMarks -= Number(q.negative_score);
    }
  });

  const attempted  = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy   = attempted ? ((correct / attempted) * 100).toFixed(1) : "0.0";

  const payload = { score: totalMarks, maxMarks, correct, wrong, unattempted, attempted, accuracy, timeTaken };
  localStorage.setItem(QUIZ_RESULT_KEY, JSON.stringify(payload));
  localStorage.removeItem(QUIZ_STATE_KEY);
  displayResults(payload);
}

// ---------- DISPLAY RESULTS ----------
function displayResults(payload) {
  el("quizCard").style.display = "none";
  el("floatBar").style.display = "none";

  // — Review tab —
  let reviewHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;">
      <button class="btn-ghost" onclick="filterResults('all')">ALL</button>
      <button class="btn-ghost" onclick="filterResults('correct')">✅ CORRECT</button>
      <button class="btn-ghost" onclick="filterResults('wrong')">❌ WRONG</button>
      <button class="btn-ghost" onclick="filterResults('unattempted')">⭕ UNATTEMPTED</button>
    </div>`;

  QUESTIONS.forEach((q, i) => {
    const ans       = answers[q.id];
    const isCorrect = ans && ans === String(q.answer);
    const status    = !ans ? "unattempted" : (isCorrect ? "correct" : "wrong");
    const badgeColor = status==="correct" ? "var(--success)" : status==="wrong" ? "var(--danger)" : "var(--muted)";
    const badgeLabel = status==="correct" ? "✅ Correct" : status==="wrong" ? "❌ Wrong" : "⭕ Unattempted";

    reviewHTML += `<div class="card result-q" data-status="${status}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;">
        <div style="font-weight:700;flex:1;line-height:1.5">Q${i+1}: ${q.question}</div>
        <span style="background:${badgeColor};color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap;font-weight:600;">${badgeLabel}</span>
      </div>`;

    ["option_1","option_2","option_3","option_4","option_5"].forEach((key, j) => {
      if (!q[key]) return;
      const idx = j + 1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser       = ans && String(idx) === String(ans);
      let style = "border:1px solid var(--border);background:var(--card);";
      if (isOptCorrect)            style = "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if (isUser && !isOptCorrect) style = "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      const label = isOptCorrect
        ? `<span style="color:var(--success);font-weight:700;margin-left:6px;">✓ Correct</span>`
        : (isUser && !isOptCorrect)
          ? `<span style="color:var(--danger);font-weight:700;margin-left:6px;">✗ Your Answer</span>`
          : "";
      reviewHTML += `<div style="padding:8px;margin:5px 0;border-radius:8px;${style};display:flex;align-items:center;gap:8px;">
        <span style="flex:1">${q[key]}</span>${label}</div>`;
    });

    const scoreText  = isCorrect ? `+${q.correct_score}` : (ans ? `-${q.negative_score}` : "0");
    const scoreColor = isCorrect ? "var(--success)" : ans ? "var(--danger)" : "var(--muted)";
    reviewHTML += `<div style="margin-top:6px;font-size:13px;color:var(--muted);"><strong>Score:</strong> <span style="color:${scoreColor};font-weight:700;">${scoreText}</span></div>`;

    if (q.solution_text) {
      reviewHTML += `<div style="margin-top:10px;padding:12px;border-radius:8px;background:rgba(46,196,182,0.08);border:1px solid var(--accent);font-size:14px;line-height:1.6;">
        <strong style="color:var(--accent);">💡 Explanation:</strong>
        <div style="margin-top:6px;">${q.solution_text}</div>
      </div>`;
    }
    reviewHTML += `</div>`;
  });

  // — Summary tab —
  const pct = payload.maxMarks > 0 ? ((payload.score / payload.maxMarks) * 100).toFixed(1) : "0.0";
  const summaryHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;padding:14px;">
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">🏆</div><div style="font-size:26px;font-weight:700;color:var(--accent);">${payload.score} / ${payload.maxMarks}</div><div style="color:var(--muted);font-size:13px;">Total Score</div></div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">📊</div><div style="font-size:26px;font-weight:700;color:var(--info);">${pct}%</div><div style="color:var(--muted);font-size:13px;">Percentage</div></div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">✅</div><div style="font-size:26px;font-weight:700;color:var(--success);">${payload.correct}</div><div style="color:var(--muted);font-size:13px;">Correct</div></div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">❌</div><div style="font-size:26px;font-weight:700;color:var(--danger);">${payload.wrong}</div><div style="color:var(--muted);font-size:13px;">Wrong</div></div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">⭕</div><div style="font-size:26px;font-weight:700;color:var(--muted);">${payload.unattempted}</div><div style="color:var(--muted);font-size:13px;">Unattempted</div></div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">🎯</div><div style="font-size:26px;font-weight:700;color:var(--purple);">${payload.accuracy}%</div><div style="color:var(--muted);font-size:13px;">Accuracy</div></div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:30px;margin-bottom:4px;">⏱️</div><div style="font-size:26px;font-weight:700;color:var(--info);">${fmt(payload.timeTaken)}</div><div style="color:var(--muted);font-size:13px;">Time Taken</div></div>
    </div>
    <div style="text-align:center;margin-top:8px;padding-bottom:12px;">
      <button class="btn" onclick="reattemptQuiz()">🔄 Re-Attempt</button>
    </div>`;

  el("results").innerHTML = `
    <div class="tabs">
      <button class="tab active" data-tab="summary">Summary</button>
      <button class="tab" data-tab="review">Review</button>
    </div>
    <div class="section active" id="section-summary">${summaryHTML}</div>
    <div class="section"        id="section-review">${reviewHTML}</div>`;
  el("results").style.display = "block";

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', e => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(`section-${e.target.dataset.tab}`).classList.add('active');
    });
  });

  el("headerControls").innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="theme-toggle ${document.body.classList.contains('dark-mode') ? 'dark' : ''}" id="themeToggle" onclick="toggleTheme()">
        <span>Light</span><span>Dark</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <h1>${QUIZ_TITLE}</h1>
      <button class="btn" onclick="reattemptQuiz()">🔄 Re-Attempt</button>
    </div>`;

  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

function filterResults(type) {
  document.querySelectorAll(".result-q").forEach(c => {
    c.style.display = (type === "all" || c.dataset.status === type) ? "block" : "none";
  });
}

// ---------- LISTENERS ----------
function attachListeners() {
  el("nextBtn").addEventListener("click",  () => current < QUESTIONS.length-1 && renderQuestion(current+1));
  el("prevBtn").addEventListener("click",  () => current > 0 && renderQuestion(current-1));
  el("clearBtn").addEventListener("click", () => { delete answers[QUESTIONS[current].id]; renderQuestion(current); });
  el("paletteBtn").addEventListener("click", e => { e.stopPropagation(); togglePalette(); });
  el("submitBtn").addEventListener("click", () => {
    el("submitMsg").textContent = `You attempted ${Object.keys(answers).length} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });
  el("cancelSubmit").addEventListener("click",  () => el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", () => { el("submitModal").style.display = "none"; submitQuiz(); });
  el("themeToggle").addEventListener("click", toggleTheme);
  document.addEventListener("click", ev => {
    const pal = el("palette");
    if (pal && pal.style.display === "flex" && !pal.contains(ev.target) && !el("paletteBtn").contains(ev.target))
      pal.style.display = "none";
  });
}

// ---------- PALETTE ----------
function buildPalette() {
  const pal = el("palette");
  pal.innerHTML = "";
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "qbtn"; b.textContent = i + 1;
    b.addEventListener("click", e => { e.stopPropagation(); renderQuestion(i); pal.style.display = "none"; });
    pal.appendChild(b);
  });
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  pal.appendChild(summary);
  highlightPalette();
}

function highlightPalette() {
  const pal = el("palette");
  if (!pal) return;
  Array.from(pal.children).forEach((child, idx) => {
    if (child.id === "palette-summary") return;
    child.classList.remove("attempted","unattempted","current");
    if (idx === current)                        child.classList.add("current");
    else if (answers[QUESTIONS[idx].id])        child.classList.add("attempted");
    else                                        child.classList.add("unattempted");
  });
  const s = el("palette-summary");
  if (s) {
    const att = Object.keys(answers).length;
    s.innerHTML = `Total: ${QUESTIONS.length} | <span style="color:var(--success)">Attempted: ${att}</span> | <span style="color:var(--danger)">Unattempted: ${QUESTIONS.length - att}</span>`;
  }
}

function togglePalette() {
  const pal = el("palette");
  pal.style.display = pal.style.display === "flex" ? "none" : "flex";
  if (pal.style.display === "flex") highlightPalette();
}

function reattemptQuiz() {
  localStorage.removeItem(QUIZ_STATE_KEY);
  localStorage.removeItem(QUIZ_RESULT_KEY);
  location.reload();
}

// ---------- COPY PROTECTION ----------
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if ((e.ctrlKey||e.metaKey) && ["c","x","v","a","s","p","u"].includes(e.key.toLowerCase())) e.preventDefault();
});
</script>
</head>
<body>

<!-- HEADER -->
<header id="quizHeader" style="display:none;">
  <div class="header-inner" id="headerControls">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="theme-toggle" id="themeToggle"><span>Light</span><span>Dark</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="timer-text" id="timer">00:00</div>
      <button id="paletteBtn" class="btn-ghost">View</button>
    </div>
  </div>
</header>

<!-- QUIZ BODY -->
<div id="quizContainer" class="container" style="display:none;">
  <div id="quizCard" class="card">
    <div class="qbar">
      <div class="qmeta">Question <span id="qindex">0</span> / <span id="qtotal">0</span></div>
      <div class="marking" id="marking"></div>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
    <div id="explanation" style="display:none;"></div>
  </div>
  <div id="results" style="display:none;"></div>
</div>

<!-- FOOTER NAV -->
<div class="fbar" id="floatBar" style="display:none;">
  <div class="fbar-inner">
    <button id="prevBtn">← Prev</button>
    <button id="clearBtn" class="btn-clear">Clear</button>
    <button id="nextBtn">Next →</button>
    <button id="submitBtn" style="display:none;">Submit Test ✓</button>
  </div>
</div>

<!-- SUBMIT CONFIRMATION MODAL -->
<div id="submitModal" class="modal">
  <div class="modal-content">
    <h3>Submit Quiz?</h3>
    <p id="submitMsg"></p>
    <div class="actions">
      <button id="cancelSubmit" class="btn-ghost">Cancel</button>
      <button id="confirmSubmit" class="btn-primary">Submit</button>
    </div>
  </div>
</div>

<!-- QUESTION PALETTE -->
<div id="palette" aria-hidden="true"></div>

<!-- WATERMARK -->
<div class="watermark-container">
  <div class="watermark" style="top:10%;left:5%;">RANKUP</div>
  <div class="watermark" style="top:30%;left:60%;">RANKUP</div>
  <div class="watermark" style="top:55%;left:25%;">RANKUP</div>
  <div class="watermark" style="top:75%;left:65%;">RANKUP</div>
  <div class="watermark" style="top:90%;left:10%;">@RANKUP</div>
</div>

</body>
</html>
